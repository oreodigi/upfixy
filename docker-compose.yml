# Local development database only. Not a deployment file.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devonly-superuser
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./db/docker/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./db/bootstrap:/bootstrap:ro
      - upfixy-pg:/var/lib/postgresql/data
volumes:
  upfixy-pg:
